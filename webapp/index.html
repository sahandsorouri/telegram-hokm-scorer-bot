<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>حکم</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:Vazirmatn;font-weight:100 900;font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn[wght].woff2) format("woff2")}
:root{
  --bg:#f6eee2; --bg2:#efe3d1; --card:#fffaf3; --ink:#2b2118; --muted:#8c7b67; --line:#e6d8c3;
  --felt:#1f6b4f; --felt2:#174f3b; --gold:#f0a92e; --gold-ink:#5a3a00;
  --red:#e2483d; --red-soft:#fde3df; --blue:#2f6fe0; --blue-soft:#dfe9fd;
  --shadow:0 6px 18px rgba(80,50,20,.12); --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#15120f; --bg2:#1d1914; --card:#231e18; --ink:#f6ece0; --muted:#a8977f; --line:#352d24;
  --felt:#23795a; --felt2:#1a5c44; --gold:#ffc04d; --gold-ink:#3b2600;
  --red:#ff6a5c; --red-soft:#3a1f1c; --blue:#5b93ff; --blue-soft:#1c2740;
  --shadow:0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme=dark]{
  --bg:#15120f; --bg2:#1d1914; --card:#231e18; --ink:#f6ece0; --muted:#a8977f; --line:#352d24;
  --felt:#23795a; --felt2:#1a5c44; --gold:#ffc04d; --gold-ink:#3b2600;
  --red:#ff6a5c; --red-soft:#3a1f1c; --blue:#5b93ff; --blue-soft:#1c2740;
  --shadow:0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.topR{display:flex;align-items:center;gap:8px}
.snd.on{background:var(--gold, #f0a92e);border-color:transparent}
.snd{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;padding:0;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}
.brand .suits{font-size:15px;letter-spacing:2px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--felt);box-shadow:0 0 0 0 var(--felt);animation:ping 1.8s infinite}
.dot.off{background:var(--muted);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--felt) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* felt table */
.table{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--felt),var(--felt2));
  border-radius:28px;padding:16px;box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.06);overflow:hidden}
.table::before{content:"♠ ♥ ♣ ♦";position:absolute;inset:auto 0 6px 0;text-align:center;color:rgba(255,255,255,.08);font-size:13px;letter-spacing:10px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{position:relative;background:var(--card);border-radius:20px;padding:14px 10px 12px;text-align:center;
  transition:transform .25s}
.team.red{box-shadow:inset 0 -5px 0 var(--red)} .team.blue{box-shadow:inset 0 -5px 0 var(--blue)}
.team .name{font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px}
.team.red .name{color:var(--red)} .team.blue .name{color:var(--blue)}
.score{font-size:76px;line-height:1;font-weight:900;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.team.bump .score{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.pips{display:flex;justify-content:center;gap:5px;direction:rtl}
.pip{width:11px;height:11px;border-radius:50%;background:var(--line);transition:background .3s}
.team.red .pip.on{background:var(--red)} .team.blue .pip.on{background:var(--blue)}
.crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);
  font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.2);
  animation:crown .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes crown{from{transform:translateX(-50%) translateY(10px) scale(.4);opacity:0}}
.meta{display:flex;justify-content:space-between;color:rgba(255,255,255,.85);font-size:14px;margin:12px 4px 4px;font-weight:600}
.hands{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:800;
  background:rgba(255,255,255,.14);color:#fff;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.chip.red{background:var(--red)} .chip.blue{background:var(--blue)}
.chip.kot{outline:2px solid var(--gold)}
.chip.wrap{background:linear-gradient(135deg,var(--gold),#ff7a59);color:#2b1600}
.chip.small{height:24px;font-size:12px;padding:0 7px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.empty-hands{color:rgba(255,255,255,.6);font-size:14px;padding:4px}

.paused{position:absolute;inset:0;background:rgba(10,20,15,.72);backdrop-filter:blur(3px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;color:#fff;z-index:3;border-radius:28px}
.paused .big{font-size:22px;font-weight:800}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{border-radius:20px;padding:18px 10px;font-weight:900;font-size:20px;box-shadow:var(--shadow);transition:transform .12s,filter .12s;
  display:flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.btn:active{transform:scale(.95);filter:brightness(.95)}
.btn.red{background:var(--red);color:#fff} .btn.blue{background:var(--blue);color:#fff}
.btn.kot{grid-column:1/-1;background:var(--gold);color:var(--gold-ink);font-size:22px}
.btn.felt{background:var(--felt);color:#fff;grid-column:1/-1}
.btn[disabled]{opacity:.45;pointer-events:none}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;font-weight:700;font-size:15px;color:var(--ink)}
.mbtn:active{transform:scale(.96)}
.mbtn[disabled]{opacity:.4;pointer-events:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:14px}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:900;font-size:44px}
.vs .r{color:var(--red)} .vs .b{color:var(--blue)} .vs .sep{color:var(--muted);font-size:24px}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line);margin:10px 0 6px;direction:rtl}
.bar .r{background:var(--red);transition:width .6s} .bar .b{background:var(--blue);transition:width .6s}
.barlbl{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg2);border-radius:16px;padding:12px}
.tile .v{font-size:24px;font-weight:900}
.tile .l{font-size:13px;color:var(--muted);margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.row:first-of-type{border-top:0}
.row .k{font-weight:700} .row .v{font-weight:800;text-align:left}
.tag{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;padding:2px 9px;border-radius:999px}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.blue{background:var(--blue-soft);color:var(--blue)}
.form{display:flex;gap:5px;flex-wrap:wrap;direction:rtl}
.form i{width:16px;height:16px;border-radius:5px;display:block}
.form i.red{background:var(--red)} .form i.blue{background:var(--blue)}
.hero{text-align:center;padding:26px 16px}
.fan{position:relative;height:118px;margin:0 auto 8px;width:200px}
.pc{position:absolute;left:50%;bottom:0;width:62px;height:92px;margin-left:-31px;background:#fffaf3;border-radius:10px;
  box-shadow:0 6px 14px rgba(0,0,0,.3);transform-origin:50% 140%;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-family:serif;animation:deal .7s cubic-bezier(.3,1.4,.5,1) backwards}
.pc::before,.pc::after{content:attr(data-s);position:absolute;font-size:14px;line-height:1}
.pc::before{top:6px;left:7px}.pc::after{bottom:6px;right:7px;transform:rotate(180deg)}
.pc.r{color:#d93b30}.pc.k{color:#1d1a17}
@keyframes deal{from{transform:translateY(60px) rotate(0);opacity:0}}
.fan:hover .pc{filter:brightness(1.03)}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.hero h2{margin:6px 0 4px;font-size:22px;color:#fff}
.hero p{margin:0 0 18px;color:rgba(255,255,255,.75)}
.day{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:0 4px 6px}
.game{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:8px}
.game .line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.game .res{font-weight:900;font-size:18px}
.game .extra{display:none;margin-top:10px;flex-wrap:wrap;gap:5px}
.game.open .extra{display:flex}
.badge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.badge.gold{background:var(--gold);color:var(--gold-ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted)}
.tab .ic{font-size:21px;filter:grayscale(1);opacity:.7;transition:.2s}
.tab.on{color:var(--ink);background:var(--card)} .tab.on .ic{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.view{display:none} .view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:26px 26px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{text-align:center;margin:4px 0 4px;font-size:20px}
.sheet .sub{text-align:center;margin-bottom:14px}
.sheet .in{max-width:520px;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.seg button{border-radius:16px;padding:14px;font-weight:800;background:var(--bg2);border:2px solid transparent}
.seg button.on.red{border-color:var(--red);color:var(--red)} .seg button.on.blue{border-color:var(--blue);color:var(--blue)}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.stamp{position:fixed;left:50%;top:38%;z-index:61;transform:translate(-50%,-50%);pointer-events:none;text-align:center;
  font-weight:900;font-size:46px;color:var(--gold-ink);background:var(--gold);padding:14px 30px 16px;border-radius:26px;
  box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.35);animation:stamp 1.6s ease forwards;white-space:nowrap}
.stamp.red{background:var(--red);color:#fff}.stamp.blue{background:var(--blue);color:#fff}
.stamp small{display:block;font-size:18px;font-weight:800;margin-top:2px;opacity:.9}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(3) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}
  80%{opacity:1}100%{transform:translate(-50%,-60%) scale(.9) rotate(-6deg);opacity:0}}
.stamp.spin{animation:spinstamp 1.9s ease forwards}
@keyframes spinstamp{0%{transform:translate(-50%,-50%) rotate(-540deg) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) rotate(0) scale(1.1);opacity:1}
  85%{opacity:1}100%{transform:translate(-50%,-60%) scale(.9);opacity:0}}
.flash{position:fixed;inset:0;z-index:59;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,200,80,.55),transparent 65%);animation:flash .7s ease forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:70;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;gap:10px;padding:20px}
.center .cards{font-size:60px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--felt);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div class="spinner"></div></div></div>

<nav class="tabs" id="tabs" hidden><div class="in">
  <button class="tab on" data-tab="play"><span class="ic">🃏</span>بازی</button>
  <button class="tab" data-tab="tonight"><span class="ic">🌙</span>امشب</button>
  <button class="tab" data-tab="stats"><span class="ic">🏆</span>آمار</button>
  <button class="tab" data-tab="history"><span class="ic">📜</span>تاریخچه</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="in"><div class="grab"></div><div id="sheetBody"></div></div></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
const $ = s => document.querySelector(s);
const FA = "۰۱۲۳۴۵۶۷۸۹";
const fa = n => String(n).replace(/\d/g, d => FA[d]);
const TEAM = {red: "قرمز", blue: "آبی"};
const DOT = {red: "🔴", blue: "🔵"};
const pts = n => `<bdi dir="ltr">+${fa(n)}</bdi>`;
const other = t => t === "red" ? "blue" : "red";
let V = null, prev = null, tab = "play", busy = false, pollT = null, lastHash = "";

/* ── sound: synthesized with Web Audio, no files ── */
const SND = {ctx: null, on: true};
try{ SND.on = localStorage.getItem("hokm-sound") !== "off"; }catch(e){}
function audio(){ return SND.on ? ac() : null; }
function ac(){
  try{
    if(!SND.ctx) SND.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(SND.ctx.state === "suspended") SND.ctx.resume();
    return SND.ctx;
  }catch(e){ return null; }
}
addEventListener("pointerdown", () => audio(), {passive: true});
function tone(f, t0, len, type, vol, f2){
  const c = audio(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type || "triangle"; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + len);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.05);
}
function noise(t0, len, vol, freq, q){
  const c = audio(); if(!c) return;
  const n = Math.floor(c.sampleRate * len), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq || 2500; f.Q.value = q || 0.8; g.gain.value = vol || 0.3;
  src.connect(f).connect(g).connect(c.destination); src.start(t);
}
const N = {C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.5, G6: 1568, C4: 261.63, G4: 392, E4: 329.63};
function sfx(kind){
  if(!SND.on) return;
  switch(kind){
    case "tap": noise(0, 0.04, 0.12, 3200, 1.2); break;
    case "hand": noise(0, 0.07, 0.35, 1800); tone(N.E5, 0.04, 0.18, "triangle", 0.16); tone(N.A5, 0.11, 0.26, "triangle", 0.16); break;
    case "kot": tone(160, 0, 0.35, "sine", 0.5, 45); noise(0, 0.12, 0.4, 900, 0.6);
      [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone(f, 0.12 + i * 0.06, 0.3, "square", 0.06)); break;
    case "wrap": noise(0, 0.5, 0.25, 600, 0.4);
      [N.C5, N.D5, N.E5, N.G5, N.A5, N.C6, N.E6].forEach((f, i) => tone(f, 0.05 + i * 0.05, 0.22, "triangle", 0.13)); break;
    case "win": [N.C5, N.E5, N.G5].forEach((f, i) => tone(f, i * 0.12, 0.22, "triangle", 0.18));
      [N.C6, N.E5, N.G5].forEach(f => tone(f, 0.38, 0.9, "triangle", 0.12)); tone(N.G6, 0.42, 0.6, "sine", 0.05); break;
    case "shutout": [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone(f, i * 0.1, 0.2, "square", 0.08));
      [N.C6, N.E6, N.G6].forEach(f => tone(f, 0.42, 1.2, "triangle", 0.11)); noise(0.42, 0.6, 0.15, 6000, 0.5); break;
    case "newgame": for(let i = 0; i < 6; i++) noise(i * 0.045, 0.05, 0.25, 2200 + i * 150); tone(N.G5, 0.3, 0.2, "triangle", 0.12); break;
    case "undo": tone(N.A5, 0, 0.12, "triangle", 0.14); tone(N.E5, 0.09, 0.2, "triangle", 0.14); break;
    case "pause": tone(N.G5, 0, 0.15, "sine", 0.15); tone(N.C5, 0.1, 0.25, "sine", 0.15); break;
    case "resume": tone(N.C5, 0, 0.15, "sine", 0.15); tone(N.G5, 0.1, 0.25, "sine", 0.15); break;
    case "error": tone(140, 0, 0.25, "sawtooth", 0.08); break;
  }
}
/* ── music: a soft generative loop (Web Audio, no files), local to this phone ── */
const MUS = {on: false, timer: null, next: 0, step: 0, bar: 0, bus: null, mel: 72};
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [[48, 51, 55], [44, 48, 51], [46, 50, 53], [43, 47, 50]];   // Cm Ab Bb G
const SCALE = [60, 62, 63, 65, 67, 68, 71, 72, 74, 75, 77, 79, 80, 83, 84];  // C harmonic minor
function voice(f, t, len, type, vol, attack, dest){
  const c = SND.ctx; if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(dest || MUS.bus); o.start(t); o.stop(t + len + 0.05);
}
function drum(t, kind){
  const c = SND.ctx;
  if(kind === "dum"){

function effects(a, b){
  if(!a) return;
  const ga = a.game, gb = b.game;
  if(ga && gb && gb.hands.length > ga.hands.length){
    const h = gb.hands[gb.hands.length - 1];
    bump(h.w);
    if(h.x){ stamp("کت چرخشی! 🌀", `${TEAM[h.w]} از ۷ رد شد، امتیازش شد ${fa(gb.score[h.w])}`, true); haptic("warning"); sfx("wrap"); confetti(60, ["#f0a92e","#ff7a59","#fff"]); }
    else if(h.k){ flash(); stamp("⚡ کت!", `${TEAM[h.w]} ${pts(h.p)}`); haptic("heavy"); sfx("kot"); shake(); }
    else { haptic("medium"); sfx("hand"); }
  }
  if(ga && gb && gb.hands.length < ga.hands.length) sfx("undo");
  if(ga && gb && !ga.paused && gb.paused) sfx("pause");
  if(ga && gb && ga.paused && !gb.paused) sfx("resume");
  if(ga && !gb && b.history.length > a.history.length){
    const g = b.history[b.history.length - 1];
    if(g && g.winner){
      const lose = g.score[other(g.winner)];
      stamp(lose === 0 ? "۷ هیچ! 🔥" : "🏆 بُرد!", `${TEAM[g.winner]} ${fa(g.score[g.winner])} به ${fa(lose)}`, false, g.winner);
      confetti(lose === 0 ? 260 : 170, g.winner === "red" ? ["#e2483d","#ff9a8f","#f0a92e","#fff"] : ["#2f6fe0","#8fb4ff","#f0a92e","#fff"]);
      haptic("ok"); sfx(lose === 0 ? "shutout" : "win");
    }
  }
  if(!ga && gb && !gb.hands.length){ haptic("light"); sfx("newgame"); }
  if(!ga && gb && gb.hands.length && a.history.length > b.history.length) sfx("undo");
}

const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], raf = null;
function sizeCv(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", sizeCv); sizeCv();
function confetti(n, colors){
  const suits = ["♠","♥","♣","♦"];
  for(let i = 0; i < n; i++) parts.push({x: innerWidth * (.2 + Math.random() * .6), y: innerHeight * .35, vx: (Math.random() - .5) * 14,
    vy: -Math.random() * 15 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, s: 6 + Math.random() * 8,
    c: colors[i % colors.length], suit: Math.random() < .18 ? suits[i % 4] : null, life: 0});
  if(!raf) tick();
}
function tick(){
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if(p.suit){ cx.font = `${p.s * 2.2}px sans-serif`; cx.fillText(p.suit, 0, 0); } else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
}

      <div class="row"><span class="k">حاکم‌کت (+۳)</span><span class="v"><span class="tag red">${fa(s.hakem.red)}</span> <span class="tag blue">${fa(s.hakem.blue)}</span></span></div>
      <div class="row"><span class="k">🌀 کت چرخشی</span><span class="v"><span class="tag red">${fa(w.red)}</span> <span class="tag blue">${fa(w.blue)}</span></span></div>
      <div class="row"><span class="k">۷ هیچ</span><span class="v"><span class="tag red">${fa(F.shutouts.red)}</span> <span class="tag blue">${fa(F.shutouts.blue)}</span></span></div>
    </div>
    <div class="card"><h3>🎖 رکوردها</h3>
      ${rec("🔥", "طولانی‌ترین برد پشت سر هم", `<span class="tag red">${fa(F.best_streak.red)}</span> <span class="tag blue">${fa(F.best_streak.blue)}</span>`)}
      ${F.best_night ? rec("🌙", "بهترین شب", `${who(F.best_night)} ${fa(F.best_night.wins)} به ${fa(F.best_night.other)}`) : ""}
      ${F.comeback ? rec("🦅", "بزرگ‌ترین برگشت", `${who(F.comeback)} از ${fa(F.comeback.deficit)} امتیاز عقب`) : ""}
      ${F.fastest ? rec("⚡", "سریع‌ترین بازی", `${who(F.fastest)} ${dur(F.fastest.seconds)}`) : ""}
      ${F.longest ? rec("🐢", "طولانی‌ترین بازی", `${who(F.longest)} ${dur(F.longest.seconds)}`) : ""}
      ${F.most_hands ? rec("🃏", "بیشترین دست", `${who(F.most_hands)} ${fa(F.most_hands.hands)} دست`) : ""}
    </div>
    <div class="card"><h3>⏱ از اول تا حالا</h3><div class="grid2">
      <div class="tile"><div class="v">${fa(L.games)}</div><div class="l">بازی</div></div>
      <div class="tile"><div class="v">${fa(L.hands)}</div><div class="l">دست</div></div>
      <div class="tile"><div class="v" style="font-size:18px">${fa(Math.round(L.total_seconds / 3600))} ساعت</div><div class="l">کل زمان بازی</div></div>
      <div class="tile"><div class="v" style="font-size:18px">${dur(L.avg_game_seconds)}</div><div class="l">میانگین هر بازی</div></div>
    </div></div>`;
}

function gameRow(g, i){
  if(g.imported) return `<div class="game"><div class="line"><span class="res">قرمز ${fa(g.wins.red)}، آبی ${fa(g.wins.blue)}</span><span class="badge">ثبت دستی</span></div></div>`;
  const kots = (g.kots ? g.kots.red + g.kots.blue : 0), wraps = g.wraps ? g.wraps.red + g.wraps.blue : 0;
  const lose = g.score[other(g.winner)];
  return `<div class="game" data-open>
    <div class="line"><span class="tag ${g.winner}">${DOT[g.winner]} ${TEAM[g.winner]} برد</span>
      <span class="res"><span style="color:var(--red)">${fa(g.score.red)}</span> <span class="sub">به</span> <span style="color:var(--blue)">${fa(g.score.blue)}</span></span></div>
    <div class="line sub" style="margin-top:6px"><span>${hhmm(g.started_at)}${g.seconds ? "، " + dur(g.seconds) : ""}</span>
      <span>${lose === 0 ? `<span class="badge gold">۷ هیچ</span> ` : ""}${wraps ? `<span class="badge gold">🌀 ${fa(wraps)}</span> ` : ""}${kots ? `<span class="badge">⚡ ${fa(kots)}</span>` : ""}</span></div>
    ${g.hands ? `<div class="extra">${g.hands.map(h => handChip(h, true)).join("")}</div>` : ""}</div>`;
}

let histLimit = 12;
function renderHistory(){
  const byDay = {};
  V.history.forEach(g => { (byDay[g.day] = byDay[g.day] || []).push(g); });
  const days = Object.keys(byDay).sort().reverse();
  const shown = days.slice(0, histLimit);
  return shown.map(d => {
    const gs = byDay[d].slice().reverse();
    let r = 0, b = 0; gs.forEach(g => { if(g.imported){ r += g.wins.red; b += g.wins.blue; } else if(g.winner === "red") r++; else b++; });
    return `<div class="day"><div class="dayhead"><span>${dayName(d)}</span>
      <span><span class="tag red">${fa(r)}</span> <span class="tag blue">${fa(b)}</span></span></div>${gs.map(gameRow).join("")}</div>`;
  }).join("") + (days.length > histLimit ? `<button class="mbtn" style="width:100%;margin-top:16px" data-more>شب‌های قبل‌تر</button>` : "")
    + `<div class="sub" style="text-align:center;margin-top:14px">روی هر بازی بزن تا دست‌هاش رو ببینی</div>`;
}

/* ── kot sheet ── */
function openSheet(html){ $("#sheetBody").innerHTML = html; $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  if(tg && tg.BackButton){ tg.BackButton.show(); } bindSheet(); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); if(tg && tg.BackButton) tg.BackButton.hide(); }
$("#scrim").onclick = closeSheet;
if(tg && tg.BackButton) tg.BackButton.onClick(closeSheet);

function kotSheet(){
  const g = V.game; haptic("light");
  if(!g.hands.length){
    let hakem = g.hakem;
    const draw = () => openSheet(`<h3>⚡ کت دست اول</h3><div class="sub">حاکم اول کی بود؟</div>
      <div class="seg"><button class="${hakem === "red" ? "on red" : ""}" data-h="red">👑 قرمز</button><button class="${hakem === "blue" ? "on blue" : ""}" data-h="blue">👑 آبی</button></div>
      <div class="sub">کی کت کرد؟</div>
      <div class="actions" style="margin-top:0">
        <button class="btn red" data-k1="red">🔴 قرمز ${pts(hakem === "red" ? 2 : 3)}</button>
        <button class="btn blue" data-k1="blue">🔵 آبی ${pts(hakem === "blue" ? 2 : 3)}</button></div>`);
    draw();
    kotSheet.setH = h => { hakem = h; haptic("light"); draw(); };
    kotSheet.hakem = () => hakem;
    return;
  }
  openSheet(`<h3>⚡ کی کت کرد؟</h3><div class="sub">حاکم الان ${TEAM[g.hakem]}ه 👑</div>
    <div class="actions" style="margin-top:0">
      <button class="btn red" data-kw="red">🔴 قرمز ${pts(g.hakem === "red" ? 2 : 3)}</button>
      <button class="btn blue" data-kw="blue">🔵 آبی ${pts(g.hakem === "blue" ? 2 : 3)}</button></div>`);
}
function bindSheet(){
  document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => kotSheet.setH(b.dataset.h));
  document.querySelectorAll("[data-kw]").forEach(b => b.onclick = () => { closeSheet(); act("kot", {team: b.dataset.kw}); });
  document.querySelectorAll("[data-k1]").forEach(b => b.onclick = () => { closeSheet(); act("kot1", {team: b.dataset.k1, hakem: kotSheet.hakem()}); });
}

function confirmBox(text, cb){
  if(tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) tg.showConfirm(text, ok => ok && cb());
  else if(confirm(text)) cb();
}

function bind(){
  document.querySelectorAll("[data-win]").forEach(b => b.onclick = () => act("win", {team: b.dataset.win}));
  document.querySelectorAll("[data-kot]").forEach(b => b.onclick = kotSheet);
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if(a === "newgame" && V.game) return confirmBox("یه بازی در جریانه. پاکش کنیم و از اول شروع کنیم؟", () => act("newgame", {confirm: true}));
    haptic("light"); act(a);
  });
  document.querySelectorAll("[data-abort]").forEach(b => b.onclick = () =>
    confirmBox("این بازی بدون ثبت پاک بشه؟", () => act("abort")));
  document.querySelectorAll("[data-open]").forEach(el => el.onclick = () => { el.classList.toggle("open"); haptic("light"); });
  const sb = document.getElementById("snd"); if(sb) sb.onclick = toggleSound;
  const mb = document.getElementById("mus"); if(mb) mb.onclick = toggleMusic;
  document.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { histLimit += 15; render(); });
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  if(tab === b.dataset.tab) return;
  tab = b.dataset.tab; haptic("light"); sfx("tap");
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  render(); scrollTo(0, 0);
});

/* ── boot ── */
function theme(){
  if(!tg) return;
  document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try{ tg.setHeaderColor(bg); tg.setBackgroundColor(bg); if(tg.setBottomBarColor) tg.setBottomBarColor(bg); }catch(e){}
}
if(tg){
  tg.ready(); tg.expand(); theme(); tg.onEvent("themeChanged", theme);
  try{ if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
}
function poll(){ clearTimeout(pollT); pollT = setTimeout(async () => { if(!document.hidden && !busy) await refresh(); poll(); }, 2500); }
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); musicVisibility(); });
if(!initData) fatal(); else { refresh().then(poll); }
</script>
</body>
</html>
